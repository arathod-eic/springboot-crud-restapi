spring.application.name=user-app

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/userdb?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=6022

# ===============================
# =  JPA / Hibernate Settings   =
# ===============================
#spring.jpa.hibernate.ddl-auto=update
# use 'create', 'create-drop', 'validate', or 'none' as needed
spring.jpa.show-sql=true                
# shows generated SQL in the console
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect